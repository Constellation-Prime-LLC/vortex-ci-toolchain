name: Build toolchain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: toolchain-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Constellation-Prime-LLC/vortex-ci-toolchain' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.ref_protected && github.event_name == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive-sha: ${{ steps.build.outputs.archive-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - name: Validate repository and unit tests
        run: |
          node scripts/check-contract.mjs
          node --test
      - name: Build Linux amd64 payload
        id: build
        run: |
          docker build --platform linux/amd64 --provenance=false --tag toolchain:candidate .
          docker image inspect toolchain:candidate --format 'Unpacked image bytes: {{.Size}}'
          mkdir -p .local
          docker save toolchain:candidate --output .local/toolchain.tar
          printf 'archive-sha=%s\n' "$(sha256sum .local/toolchain.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-candidate
          path: .local/toolchain.tar
          if-no-files-found: error
          retention-days: 1

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: actions/setup-node
          ref: 49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
          path: .local/actions/setup-node
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: actions/setup-python
          ref: a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
          path: .local/actions/setup-python
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain-candidate
          path: .local
      - name: Exercise pinned actions inside pinned runner with read-only payload
        env:
          ARCHIVE_SHA: ${{ needs.build.outputs.archive-sha }}
        run: |
          printf '%s  %s\n' "$ARCHIVE_SHA" .local/toolchain.tar | sha256sum --check
          docker load --input .local/toolchain.tar
          node scripts/smoke.mjs toolchain:candidate

  publish:
    needs: [build, smoke]
    if: github.repository == 'Constellation-Prime-LLC/vortex-ci-toolchain' && github.ref == 'refs/heads/main' && github.ref_protected && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain-candidate
          path: .local
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish the tested image and resolve its immutable digest
        id: image
        env:
          ARCHIVE_SHA: ${{ needs.build.outputs.archive-sha }}
        run: |
          printf '%s  %s\n' "$ARCHIVE_SHA" .local/toolchain.tar | sha256sum --check
          docker load --input .local/toolchain.tar
          node scripts/publish.mjs push
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/constellation-prime-llc/vortex-ci-toolchain
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Retain current and previous digests after attestation
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: node scripts/publish.mjs retain
      - name: Record digest and compressed registry layer size
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s\n' "ghcr.io/constellation-prime-llc/vortex-ci-toolchain@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          docker manifest inspect "ghcr.io/constellation-prime-llc/vortex-ci-toolchain@$IMAGE_DIGEST" | node -e 'let s=""; process.stdin.on("data", c => s+=c); process.stdin.on("end", () => console.log("Compressed registry layer bytes:", JSON.parse(s).layers.reduce((n,l)=>n+l.size,0)));'
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
